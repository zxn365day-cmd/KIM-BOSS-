<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --deep-blue: #001f66;
    --royal-blue: #0055ff;
    --electric-blue: #00d4ff;
    --cyan-glow: #00f0ff;
    --dark-navy: #020a1c;
    --gold: #ffd700;
}

html, body {
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    background: #00030a;
    font-family: 'Orbitron', sans-serif;
}

#game-frame {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    z-index: 1;
}

/* FLOATING LOGO AFTER HIDE */
#fab-icon {
    position: fixed;
    top: 25px;
    left: 20px;
    width: 45px;
    height: 45px;
    border-radius: 50%;
    border: 1.5px solid var(--electric-blue);
    box-shadow: 0 0 12px var(--royal-blue), inset 0 0 6px var(--cyan-glow);
    background: url("https://i.ibb.co/TBwwDm0b/IMG-4635.jpg") center/cover no-repeat;
    cursor: pointer;
    z-index: 100000;
    display: none;
    animation: fabPulse 2s infinite alternate;
    touch-action: none;
}

@keyframes fabPulse {
    to {
        transform: scale(1.08);
        box-shadow: 0 0 20px var(--electric-blue);
    }
}

#rgb-parent {
    position: fixed;
    top: 75px;
    right: 15px;
    width: 220px;
    z-index: 99999;
    touch-action: none;
    perspective: 1000px;
    transform: scale(.95);
    transform-origin: top right;
    padding-top: 42px;
}

@keyframes rgbBorderFlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.unified-rgb-shared {
    background: linear-gradient(135deg,#00ffff,#0055ff,#ff0055,#ffd700,#00ffaa,#00ffff);
    background-size: 400% 400%;
    animation: rgbBorderFlow 3.5s linear infinite;
    box-shadow: 0 0 10px #00d4ff99, 0 0 20px #0055ff66, inset 0 0 6px #ffffff4d;
}

.external-top-crown {
    position: absolute;
    top: 2px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 45;
    background: rgba(2,10,28,.95);
    border: 1.5px solid var(--electric-blue);
    border-bottom: none;
    border-radius: 6px 6px 0 0;
    padding: 3px 10px;
    box-shadow: 0 -4px 12px #00d4ffb3;
}

.top-head-badge {
    width: 44px;
    height: 38px;
    object-fit: cover;
    border-radius: 3px;
    display: block;
    filter: drop-shadow(0 0 5px #fff200);
}

.realistic-wing-fitted {
    position: absolute;
    top: 75px;
    width: 95px;
    height: auto;
    pointer-events: none;
    z-index: 0;
    filter: drop-shadow(0 0 8px #00d4ff) drop-shadow(0 0 14px #0055ff);
    object-fit: contain;
}

.wing-left {
    left: -70px;
    transform-origin: 95% 50%;
    animation: flapLeft3D 2.5s ease-in-out infinite alternate;
}

.wing-right {
    right: -70px;
    transform-origin: 5% 50%;
    animation: flapRight3D 2.5s ease-in-out infinite alternate;
}

@keyframes flapLeft3D {
    0% { transform: translateY(-50%) translateZ(-40px) rotateY(25deg) rotateZ(-3deg) scale(.95); }
    50% { transform: translateY(-50%) translateZ(-15px) rotateY(-15deg) rotateZ(3deg) scale(1.02); }
    100% { transform: translateY(-50%) translateZ(-35px) rotateY(15deg) rotateZ(-1deg) scale(1); }
}

@keyframes flapRight3D {
    0% { transform: translateY(-50%) translateZ(-40px) rotateY(-25deg) rotateZ(3deg) scale(.95); }
    50% { transform: translateY(-50%) translateZ(-15px) rotateY(15deg) rotateZ(-3deg) scale(1.02); }
    100% { transform: translateY(-50%) translateZ(-35px) rotateY(-15deg) rotateZ(1deg) scale(1); }
}

.bolt-3d-svg {
    position: absolute;
    pointer-events: none;
    z-index: 25;
    filter: drop-shadow(0 0 6px #ffd700);
}

.bolt-left-side {
    top: 55px;
    left: -12px;
    width: 22px;
    height: 35px;
    animation: boltFloatLeft 2s ease-in-out infinite alternate;
}

.bolt-right-side {
    top: 55px;
    right: -12px;
    width: 22px;
    height: 35px;
    animation: boltFloatRight 2.2s ease-in-out infinite alternate;
}

.bolt-center-flash {
    top: 50%;
    left: 50%;
    width: 52px;
    height: 70px;
    transform: translate(-50%,-50%) scale(0);
    opacity: 0;
    z-index: 26;
}

@keyframes boltFloatLeft {
    to { transform: rotate(-10deg) translateY(-5px) scale(1.05); }
}

@keyframes boltFloatRight {
    to { transform: rotate(10deg) translateY(5px) scale(1.05); }
}

.strike-active {
    animation: boltStrikeAnimation .6s ease forwards;
}

@keyframes boltStrikeAnimation {
    0% { transform: translate(-50%,-50%) scale(.2) rotate(-20deg); opacity: 0; }
    50% {
        transform: translate(-50%,-50%) scale(1.3) rotate(5deg);
        opacity: 1;
        filter: drop-shadow(0 0 20px white) drop-shadow(0 0 35px gold);
    }
    80% { transform: translate(-50%,-50%) scale(1); opacity: .9; }
    100% {
        transform: translate(-50%,-50%) scale(0) rotate(15deg);
        opacity: 0;
    }
}

.cyber-chassis-outer {
    width: 100%;
    padding: 2px;
    position: relative;
    z-index: 10;
    border-radius: 6px;
}

.cyber-chassis-inner {
    width: 100%;
    background: var(--dark-navy);
    border: 1px solid var(--electric-blue);
    border-radius: 5px;
    padding: 6px;
    position: relative;
    box-shadow: inset 0 0 10px #00d4ff4d, inset 0 0 5px #ff005540;
}

.hud-corner {
    position: absolute;
    width: 14px;
    height: 14px;
    pointer-events: none;
    z-index: 30;
}

.hud-corner::before,
.hud-corner::after {
    content: '';
    position: absolute;
    background: white;
    box-shadow: 0 0 6px #00ffff, 0 0 12px #0055ff;
}

.hud-corner-tl { top: -4px; left: -4px; }
.hud-corner-tl::before { top: 0; left: 0; width: 12px; height: 2.5px; }
.hud-corner-tl::after { top: 0; left: 0; width: 2.5px; height: 12px; }

.hud-corner-tr { top: -4px; right: -4px; }
.hud-corner-tr::before {
    top: 0;
    right: 0;
    width: 12px;
    height: 2.5px;
    background: gold;
    box-shadow: 0 0 6px gold;
}
.hud-corner-tr::after {
    top: 0;
    right: 0;
    width: 2.5px;
    height: 12px;
    background: gold;
    box-shadow: 0 0 6px gold;
}

.hud-corner-bl { bottom: -4px; left: -4px; }
.hud-corner-bl::before { bottom: 0; left: 0; width: 12px; height: 2.5px; }
.hud-corner-bl::after { bottom: 0; left: 0; width: 2.5px; height: 12px; }

.hud-corner-br { bottom: -4px; right: -4px; }
.hud-corner-br::before {
    bottom: 0;
    right: 0;
    width: 12px;
    height: 2.5px;
    background: #ff0055;
    box-shadow: 0 0 6px #ff0055;
}
.hud-corner-br::after {
    bottom: 0;
    right: 0;
    width: 2.5px;
    height: 12px;
    background: #ff0055;
    box-shadow: 0 0 6px #ff0055;
}

.app-screen { display: none !important; }
.app-screen.active { display: block !important; }

.brand-header {
    display: flex;
    align-items: center;
    justify-content: center;

    margin-bottom: 4px;

}

.brand-inline-group {

}

.logo-rgb-wrap {

.brand-mini-circle-logo {

.brand-text-handle {

.header-line-sep {

.cyber-top-status-bar {

                                    points="50,5 90,25 90,75 50,95 10,75 10,25"
                                    fill="none"
                                    stroke="#00d4ff"
                                    stroke-width="4"
                                    stroke-dasharray="12,6"/>

                                <polygon
                                    points="50,12 83,29 83,71 50,88 17,71 17,29"
                                    fill="none"
                                    stroke="#00ffff"
                                    stroke-width="2"/>

                            </svg>

                            <div class="ai-core-pulse">
                                <img
                                    id="numberShotImg"
                                    class="number-shot-img"
                                    src=""
                                    alt="Prediction image">
                            </div>

                        </div>

                        <div class="signal-pill-display">
                            <div id="predictionSignal" class="signal-main-text">
                                ⏳⏳⏳
                            </div>
                        </div>

                    </div>

                    <div class="stars-row-flex">
                        <span>⭐</span>
                        <span>⭐</span>
                        <span>⭐</span>
                        <span>⭐</span>
                        <span>⭐</span>
                    </div>

                </div>

                <div class="status-row">

                    <div class="period-pill-container">
                        PRD:
                        <span id="periodDisplay">0000</span>
                    </div>

                    <div class="timer-pill-container">
                        TDR:
                        <span id="timerDisplay">30s</span>
                    </div>

                </div>

                <div class="leader-banner-box">

                    <div class="leader-banner-inner">
                        <div class="leader-name-text">
                            _KIM ZAYN
                        </div>
                    </div>

                </div>

            </div>

        </div>
    </div>
</div>

<script>
(function () {
    'use strict';

    const CONFIG = {
        telegramRedirect: "https://t.me/Kim_Zayn101",
        staticKeys: ["KIMBOSS"]
    };

    const SMALL_IMAGES = [
        "https://i.ibb.co/zTnYR7WL/IMG-20260907-192359-299.jpg",
        "https://i.ibb.co/tM0dM6X2/IMG-20260907-192401-381.jpg",
        "https://i.ibb.co/wrFcjF3Z/IMG-20260907-192402-739.jpg",
        "https://i.ibb.co/YTtdFNSt/IMG-20260907-192403-903.jpg",
        "https://i.ibb.co/LzswnGYB/IMG-20260907-192405-307.jpg"
    ];

    const BIG_IMAGES = [
        "https://i.ibb.co/DJyFDZH/IMG-20260907-192406-786.jpg",
        "https://i.ibb.co/v4Kpx2Mg/IMG-20260907-192408-507.jpg",
        "https://i.ibb.co/xtJ7KNhm/IMG-20260907-192409-174.jpg",
        "https://i.ibb.co/5g9w1Zpt/IMG-20260907-192410-607.jpg",
        "https://i.ibb.co/S7VWbDDG/IMG-20260907-192412-215.jpg"
    ];

    [...SMALL_IMAGES, ...BIG_IMAGES].forEach(function (url) {
        const img = new Image();
        img.src = url;
    });

    const LOGIC_ENGINES = [
        {
            name: "Zig-Zag",
            detect: b => b[0] !== b[1] && b[1] !== b[2],
            predict: b => ({
                bs: b[0] === "BIG" ? "SMALL" : "BIG"
            })
        },
        {
            name: "Mirror",
            detect: b => b[0] === b[3] && b[1] === b[2],
            predict: b => ({
                bs: b[0]
            })
        },
        {
            name: "Dragon",
            detect: b => b[0] === b[1] && b[1] === b[2],
            predict: b => ({
                bs: b[0]
            })
        },
        {
            name: "Sandwich",
            detect: b => b[0] === b[2] && b[0] !== b[1],
            predict: b => ({
                bs: b[1]
            })
        }
    ];

    let dataFetchInterval = null;
    let tickInterval = null;
    let lastProcessedPeriod = null;

    const apiBaseUrl =
        "https://draw.ar-lottery01.com/WinGo/WinGo_30S/GetHistoryIssuePage.json?pageNo=1&pageSize=50";

    const parentWidget = document.getElementById("rgb-parent");
    const fabIcon = document.getElementById("fab-icon");
    const loginScreen = document.getElementById("loginScreen");
    const engineScreen = document.getElementById("engineScreen");
    const keyInput = document.getElementById("keyInput");
    const periodDisplay = document.getElementById("periodDisplay");
    const timerDisplay = document.getElementById("timerDisplay");
    const predictionSignal = document.getElementById("predictionSignal");
    const numberShotImg = document.getElementById("numberShotImg");
    const errorOverlay = document.getElementById("error-overlay");
    const centerStrikeBolt = document.getElementById("centerStrikeBolt");
    const pingValue = document.getElementById("pingValue");

    function updateDynamicPing() {
        pingValue.textContent =
            (Math.floor(Math.random() * 14) + 28) + "MS";
    }

    setInterval(updateDynamicPing, 2500);

    function triggerDynamic3DBolt() {
        if (!centerStrikeBolt) return;

        centerStrikeBolt.classList.remove("strike-active");

        void centerStrikeBolt.offsetWidth;

        centerStrikeBolt.classList.add("strike-active");

        setTimeout(
            triggerDynamic3DBolt,
            Math.random() * 2500 + 1200
        );
    }

    setTimeout(triggerDynamic3DBolt, 1000);

    function runSecondTicker() {
        const remaining =
            30 - (Math.floor(Date.now() / 1000) % 30);

        timerDisplay.textContent = remaining + "s";
    }

    function makeDraggable(element) {
        let isDragging = false;

        let startX = 0;
        let startY = 0;

        let initialLeft = 0;
        let initialTop = 0;

        function startDrag(e) {

            if (e.target.closest("input, button")) return;

            isDragging = true;

            const point =
                e.touches ? e.touches[0] : e;

            const rect =
                element.getBoundingClientRect();

            startX = point.clientX;
            startY = point.clientY;

            initialLeft = rect.left;
            initialTop = rect.top;

            document.addEventListener(
                "mousemove",
                onMove
            );

            document.addEventListener(
                "mouseup",
                onStop
            );

            document.addEventListener(
                "touchmove",
                onMove,
                { passive: false }
            );

            document.addEventListener(
                "touchend",
                onStop
            );
        }

        function onMove(e) {

            if (!isDragging) return;

            if (e.cancelable) {
                e.preventDefault();
            }

            const point =
                e.touches ? e.touches[0] : e;

            const dx =
                point.clientX - startX;

            const dy =
                point.clientY - startY;

            element.style.left =
                (initialLeft + dx) + "px";

            element.style.top =
                (initialTop + dy) + "px";

            element.style.right = "auto";
        }

        function onStop() {

            isDragging = false;

            document.removeEventListener(
                "mousemove",
                onMove
            );

            document.removeEventListener(
                "mouseup",
                onStop
            );

            document.removeEventListener(
                "touchmove",
                onMove
            );

            document.removeEventListener(
                "touchend",
                onStop
            );
        }

        element.addEventListener(
            "mousedown",
            startDrag
        );

        element.addEventListener(
            "touchstart",
            startDrag,
            { passive: false }
        );
    }

    makeDraggable(parentWidget);
    makeDraggable(fabIcon);

    window.hideWidget = function () {

        parentWidget.style.display = "none";

        fabIcon.style.display = "block";
    };

    window.showWidget = function () {

        parentWidget.style.display = "block";

        fabIcon.style.display = "none";
    };

    function playHackingAlertSound() {

        try {

            const AudioContextClass =
                window.AudioContext ||
                window.webkitAudioContext;

            if (!AudioContextClass) return;

            const ctx =
                new AudioContextClass();

            const startTime =
                ctx.currentTime;

            for (let i = 0; i < 3; i++) {

                const osc =
                    ctx.createOscillator();

                const gain =
                    ctx.createGain();

                const t =
                    startTime + i * 0.3;

                osc.type = "sawtooth";

                osc.frequency.setValueAtTime(
                    750,
                    t
                );

                osc.frequency.linearRampToValueAtTime(
                    1500,
                    t + 0.15
                );

                osc.frequency.linearRampToValueAtTime(
                    750,
                    t + 0.3
                );

                gain.gain.setValueAtTime(
                    0.15,
                    t
                );

                gain.gain.exponentialRampToValueAtTime(
                    0.01,
                    t + 0.3
                );

                osc.connect(gain);

                gain.connect(ctx.destination);

                osc.start(t);

                osc.stop(t + 0.3);
            }

        } catch (e) {
            // Audio is optional.
        }
    }

    window.verifyKey = function () {

        const value =
            keyInput.value.trim();

        if (CONFIG.staticKeys.includes(value)) {

            errorOverlay.style.display =
                "none";

            loginScreen.classList.remove(
                "active"
            );

            engineScreen.classList.add(
                "active"
            );

            initGameEngine();

            return;
        }

        playHackingAlertSound();

        errorOverlay.style.display =
            "flex";

        errorOverlay.innerHTML = `
            <div style="color:#00ffff;font-size:8.5px;">
                ⚡ BYPASS WARNING ⚡
            </div>

            <div style="color:#ffd700;font-size:7px;margin-top:2px;">
                KEY DM KIM!
            </div>

            <div style="color:#ffffff;font-size:6.5px;margin-top:3px;">
                REDIRECTING TO TELEGRAM...
            </div>
        `;

        let toggle = 0;

        const flashInterval =
            setInterval(function () {

                errorOverlay.style.background =
                    toggle % 2 === 0
                        ? "rgba(0,212,255,.95)"
                        : "rgba(255,0,85,.95)";

                errorOverlay.style.color =
                    toggle % 2 === 0
                        ? "#00030a"
                        : "#ffffff";

                toggle++;

            }, 120);

        setTimeout(function () {

            clearInterval(flashInterval);

            window.open(
                CONFIG.telegramRedirect,
                "_blank"
            );

            errorOverlay.style.display =
                "none";

        }, 1000);
    };

    function initGameEngine() {

        if (dataFetchInterval) {
            clearInterval(dataFetchInterval);
        }

        if (tickInterval) {
            clearInterval(tickInterval);
        }

        fetchHistory();

        dataFetchInterval =
            setInterval(
                fetchHistory,
                3000
            );

        tickInterval =
            setInterval(
                runSecondTicker,
                1000
            );

        runSecondTicker();

        const video =
            document.getElementById(
                "bg-video"
            );

        if (video) {

            video.play().catch(function () {
                // Mobile browsers may require user interaction.
            });
        }
    }

    async function fetchHistory() {

        try {

            const response =
                await fetch(
                    apiBaseUrl,
                    {
                        cache: "no-store"
                    }
                );

            if (!response.ok) {

                throw new Error(
                    "History request failed: " +
                    response.status
                );
            }

            const data =
                await response.json();

            if (
                data &&
                data.code === 0 &&
                data.data &&
                data.data.list
            ) {

                processEngineData(
                    data.data.list
                );
            }

        } catch (error) {

            console.warn(
                "Unable to fetch game history.",
                error
            );
        }
    }

    function processEngineData(list) {

        if (
            !Array.isArray(list) ||
            list.length === 0
        ) {
            return;
        }

        const latest = list[0];

        const nextIssueNumber =
            (
                BigInt(
                    latest.issueNumber
                ) + 1n
            ).toString();

        periodDisplay.textContent =
            nextIssueNumber;

        if (
            lastProcessedPeriod ===
            nextIssueNumber
        ) {
            return;
        }

        lastProcessedPeriod =
            nextIssueNumber;

        const historyItems =
            list.slice(0, 10).map(
                function (item) {

                    const number =
                        parseInt(
                            item.number,
                            10
                        );

                    return {
                        num: number,
                        bs: number >= 5
                            ? "BIG"
                            : "SMALL"
                    };
                }
            );

        const bsArray =
            historyItems.map(
                item => item.bs
            );

        let selectedPrediction =
            null;

        for (
            const engine
            of LOGIC_ENGINES
        ) {

            if (
                bsArray.length >= 4 &&
                engine.detect(bsArray)
            ) {

                selectedPrediction =
                    engine.predict(
                        bsArray
                    );

                break;
            }
        }

        if (!selectedPrediction) {

            selectedPrediction = {
                bs:
                    bsArray[0] === "BIG"
                        ? "SMALL"
                        : "BIG"
            };
        }

        const prediction =
            selectedPrediction.bs;

        predictionSignal.textContent =
            prediction;

        const imagePool =
            prediction === "BIG"
                ? BIG_IMAGES
                : SMALL_IMAGES;

        const imageUrl =
            imagePool[
                Math.floor(
                    Math.random() *
                    imagePool.length
                )
            ];

        numberShotImg.onerror =
            function () {

                console.warn(
                    "Prediction image could not be loaded:",
                    imageUrl
                );

                numberShotImg.removeAttribute(
                    "src"
                );

                numberShotImg.alt =
                    "Image unavailable";
            };

        numberShotImg.onload =
            function () {

                numberShotImg.alt =
                    prediction +
                    " prediction image";
            };

        numberShotImg.src =
            imageUrl;
    }

})();
</script>

</body>
</html>
